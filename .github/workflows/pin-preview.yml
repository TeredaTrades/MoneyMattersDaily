name: Generate Pinterest pin + hero previews

# Runs on PRs that add or change blog posts. Generates a pin PNG (Pinterest)
# and a hero PNG (in-post banner, public/heroes/) for each changed post and
# commits both back onto the PR branch, so reviewers see the actual images
# in the PR diff before anything is approved. Pin approval is still just
# setting `pinApproved: true` in that post's frontmatter as part of the same
# PR — nothing gets pinned or published from this workflow. Heroes have no
# separate approval gate (they're not sent to a third party like Pinterest
# is) — they render on the live post automatically once the PR merges.

on:
  pull_request:
    paths:
      - 'src/content/blog/**.md'

permissions:
  contents: write

# Shared with x-draft.yml on purpose: both workflows trigger on the same
# PR event and push to the same branch. Without this, they run in parallel
# and race to push, and whichever finishes second gets a non-fast-forward
# rejection (seen in practice on 2026-08-30, see NOTES.md). Same group name
# across both files serializes them instead of letting them collide.
concurrency:
  group: blog-post-ci-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  generate-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find changed blog posts
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: src/content/blog/**.md

      - name: Generate pin image(s)
        if: steps.changed.outputs.any_changed == 'true'
        run: node scripts/generate-pin.mjs ${{ steps.changed.outputs.all_changed_files }}

      - name: Generate hero image(s)
        if: steps.changed.outputs.any_changed == 'true'
        run: node scripts/generate-hero.mjs ${{ steps.changed.outputs.all_changed_files }}

      # Belt-and-suspenders alongside the concurrency group above: rebase
      # onto whatever's now on the branch (e.g. x-draft's commit) before
      # committing, so a push here can't be rejected as non-fast-forward.
      # --autostash: this workflow has happened to run first every time so
      # far, so the dirty-working-tree failure seen in x-draft.yml on
      # 2026-08-31 hasn't hit it yet, but the same generate-then-pull order
      # would cause it here too if this ever runs second. Fixed preventively.
      - name: Pull latest before committing
        if: steps.changed.outputs.any_changed == 'true'
        run: git pull --rebase --autostash origin ${{ github.head_ref }}

      - name: Commit generated pins + heroes
        if: steps.changed.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate pin + hero preview(s) [skip ci]"
          file_pattern: 'public/pins/*.png public/heroes/*.png'
          commit_user_name: pin-preview-bot
          commit_user_email: actions@github.com
