name: Close post reminder on publish

# Companion to daily-post-reminder.yml — when a new post lands on
# main, close any open "content-reminder" issues, since the thing
# they were nagging about just happened.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**.md'

permissions:
  issues: write

jobs:
  close-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Close open content-reminder issues
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'content-reminder'
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Closed automatically — a new post was published.'
              });
            }
